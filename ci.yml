name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vizo
          POSTGRES_PASSWORD: vizo_dev_password
          POSTGRES_DB: vizo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vizo -d vizo" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://vizo:vizo_dev_password@localhost:5432/vizo?schema=public
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: vizo_minio_dev
      S3_SECRET_KEY: vizo_minio_dev_secret
      S3_BUCKET: vizo-files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start S3-compatible storage
        run: |
          docker run -d --name s3 -p 9000:9000 \
            -e MINIO_ROOT_USER=vizo_minio_dev -e MINIO_ROOT_PASSWORD=vizo_minio_dev_secret \
            "${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}" server /data
          for i in $(seq 1 30); do curl -fsS http://localhost:9000/minio/health/live && break || sleep 2; done
        working-directory: .
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - name: Apply schema
        run: |
          npx prisma db push --skip-generate
          npm run db:constraints
          npm run db:seed
      - run: npm test
      - run: npm run build
      - run: sh backend/scripts/check-secrets.sh
        working-directory: .

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Compose smoke test (все сервисы + /health)
        working-directory: backend
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose up -d --build
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health/ready; then ok=1; break; fi
            sleep 3
          done
          echo
          curl -fsS http://127.0.0.1:3000/health
          docker compose ps
          [ "$ok" = 1 ] || { docker compose logs --no-color; exit 1; }
      - name: Logs on failure
        if: failure()
        working-directory: backend
        run: docker compose logs --no-color
      - name: Teardown
        if: always()
        working-directory: backend
        run: docker compose down -v
