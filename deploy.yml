name: Deploy

# Автодеплой выключен, пока нет VPS: включается переменной репозитория DEPLOY_ENABLED=true
# и секретами (Settings → Secrets and variables → Actions). Запуск: тег v* или вручную.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/api:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: APP_VERSION=${{ github.sha }}

  deploy:
    needs: build-and-push
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload compose file and env
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes $USER_NAME@$HOST"
          $SSH 'mkdir -p ~/vizo'
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes backend/docker-compose.prod.yml "$USER_NAME@$HOST:~/vizo/docker-compose.yml"
          printf '%s\n' "$PROD_ENV_FILE" | $SSH 'umask 077; cat > ~/vizo/.env'
          $SSH "cd ~/vizo && sed -i '/^API_IMAGE=/d' .env && echo 'API_IMAGE=$IMAGE' >> .env"
      - name: Pull and restart
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_PULL_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$USER_NAME@$HOST" \
            "echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin && cd ~/vizo && docker compose pull && docker compose up -d --remove-orphans && docker compose ps"
